<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>bullettime</title>
<style>body{background:#111;color:#ddd;font-family:sans-serif;margin:16px;text-align:center}
video{width:100%;max-width:480px;border-radius:8px;background:#000}
a{display:inline-block;margin-top:16px;font-size:18px;padding:12px 36px;background:#2a7;color:#fff;border-radius:8px;text-decoration:none}
p{color:#888;font-size:13px}</style>
<h3>あなたのバレットタイム</h3>
<video id="v" autoplay muted loop playsinline controls></video><br>
<a id="dl" href="#" download>動画を保存</a>
<p>保存できないときは動画を長押し →「ビデオを保存」</p>
<script>
const id=(new URLSearchParams(location.search).get('id')||'').replace(/[^A-Za-z0-9_-]/g,'');
if(id){const u='https://raw.githubusercontent.com/ykassy/bullettime-drops/main/v/'+id+'.mp4';
  document.getElementById('v').src=u; const a=document.getElementById('dl'); a.href=u; a.download='bullettime_'+id+'.mp4';}
else{document.body.innerHTML='<p>動画が指定されていません</p>';}
</script></html>
